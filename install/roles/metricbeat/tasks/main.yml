---
#
# install/run metricbeat elk client
#
- name: Configure Metricbeat
  when: effective_logging_backend != 'fluentd'
  become: true
  block:
    - name: Install metricbeat package
      ansible.builtin.package:
        name: metricbeat
        state: present

    - name: Generate metricbeat configuration template
      ansible.builtin.template:
        src: metricbeat.yml.j2
        dest: /etc/metricbeat/metricbeat.yml
        owner: root
        group: root
        mode: '0644'
      register: metricbeat_config

    - name: Ensure metricbeat service is started and enabled
      ansible.builtin.service:
        name: metricbeat
        state: started
        enabled: true

    - name: Restart metricbeat if configuration changed
      ansible.builtin.service:
        name: metricbeat
        state: restarted
      when: metricbeat_config.changed
