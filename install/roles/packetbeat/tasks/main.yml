---
#
# install/run packetbeat elk client
#
- name: Install packetbeat packages
  ansible.builtin.package:
    name:
      - packetbeat
      - "{{ 'libpcap' if ansible_os_family == 'RedHat' else 'libpcap0.8' }}"
    state: present
  become: true
  when: logging_backend != 'fluentd'

- name: Generate packetbeat configuration template
  ansible.builtin.template:
    src: packetbeat.yml.j2
    dest: /etc/packetbeat/packetbeat.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  when: logging_backend != 'fluentd'
  register: packetbeat_config

- name: Ensure packetbeat service is enabled and started
  ansible.builtin.service:
    name: packetbeat
    state: started
    enabled: true
  become: true
  when: logging_backend != 'fluentd'

- name: Restart packetbeat service if configuration changed
  ansible.builtin.service:
    name: packetbeat
    state: restarted
  become: true
  when:
    - logging_backend != 'fluentd'
    - packetbeat_config.changed
