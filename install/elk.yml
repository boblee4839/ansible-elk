---
#
# Playbook to install the ELK or EFK stack
#
# versions:
#  - 2.4 (git branch 2.4)
#  - 5.6 (git branch 5.6)
#  - 6.8 (git branch 6.8)
#  - 9.x (git branch master)
#

- name: Install and configure ELK/EFK stack
  hosts: elk
  remote_user: "{{ ansible_system_user }}"
  vars_files:
    - group_vars/all.yml
  pre_tasks:
    # Check if fluentd backend is supported on this platform
    - name: Detect fluent-package v6 platform support
      set_fact:
        fluentd_platform_supported: >-
          {{
            (ansible_distribution == 'Debian' and ansible_distribution_major_version|int >= 12) or
            (ansible_distribution == 'Ubuntu' and ansible_distribution_version is version('22.04', '>=')) or
            (ansible_os_family == 'RedHat' and ansible_distribution_major_version|int < 10)
          }}

    - name: Determine effective logging backend
      set_fact:
        effective_logging_backend: >-
          {{
            'logstash' if ((logging_backend | default('')) == 'fluentd' and not fluentd_platform_supported | bool)
                       else (logging_backend | default('logstash'))
          }}

    - name: Warn about automatic fallback to logstash
      debug:
        msg: |
          ================================================================================
          AUTOMATIC FALLBACK: FLUENTD → LOGSTASH
          ================================================================================
          Platform: {{ ansible_distribution }} {{ ansible_distribution_version }}

          fluent-package v6 LTS is not available for your platform.

          Supported platforms for fluentd backend:
            ✓ RHEL/Rocky Linux 8, 9
            ✓ Debian 12 (Bookworm) and newer
            ✓ Ubuntu 22.04 (Jammy) and newer

          Your platform: {{ ansible_distribution }} {{ ansible_distribution_version }}
            ✗ Not supported for fluent-package v6

          ACTION: Automatically using Logstash backend instead.
          Logstash provides the same functionality and works on all platforms.

          To suppress this warning, change logging_backend in group_vars/all.yml:
            logging_backend: "logstash"    # or leave empty ""
          ================================================================================
      when:
        - logging_backend == 'fluentd'
        - not fluentd_platform_supported | bool

  roles:
    - { role: elasticsearch }
    - { role: fluentd, when: (effective_logging_backend == 'fluentd') }
    - { role: logstash, when: ((effective_logging_backend is none) or (effective_logging_backend == 'logstash') or (effective_logging_backend == '')) }
    - { role: nginx, when: (apache_reverse_proxy is none) }
    - { role: apache, when: apache_reverse_proxy|bool }
    - { role: curator, when: install_curator_tool|bool }
    - { role: kibana }
    - { role: firewall, when: manage_firewall|bool }
    - { role: instructions }
