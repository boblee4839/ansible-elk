---
#
# install xpack suite for elastic services
#

- name: Check if elasticsearch xpack is installed
  ansible.builtin.stat:
    path: /usr/share/elasticsearch/plugins/x-pack
  register: check_es_xpack_path
  become: true

- name: Check if kibana xpack is installed
  ansible.builtin.stat:
    path: /usr/share/kibana/plugins/x-pack
  register: check_kibana_xpack_path
  become: true

- name: Check if logstash xpack is installed
  ansible.builtin.shell:
    cmd: /usr/share/logstash/bin/logstash-plugin list | grep x-pack
  register: check_logstash_xpack_installed
  failed_when: check_logstash_xpack_installed.rc not in [0, 1]
  changed_when: false
  become: true

- name: Install xpack for elasticsearch
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-plugin install x-pack -b
  when:
    - install_elasticsearch_xpack | default(false) | bool
    - not check_es_xpack_path.stat.exists
  become: true

- name: Install xpack for kibana, this might take a while
  ansible.builtin.command:
    cmd: /usr/share/kibana/bin/kibana-plugin install x-pack
  when:
    - install_kibana_xpack | default(false) | bool
    - not check_kibana_xpack_path.stat.exists
  become: true

- name: Install xpack for logstash
  ansible.builtin.command:
    cmd: /usr/share/logstash/bin/logstash-plugin install x-pack -b
  when:
    - install_logstash_xpack | default(false) | bool
    - check_logstash_xpack_installed.rc == 1
  become: true
