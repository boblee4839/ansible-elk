---
#
# install/run heartbeat elk client
#
- name: Install heartbeat package
  ansible.builtin.package:
    name: heartbeat-elastic
    state: present
  become: true
  when: effective_logging_backend != 'fluentd'

- name: Generate heartbeat configuration template
  ansible.builtin.template:
    src: heartbeat.yml.j2
    dest: /etc/heartbeat/heartbeat.yml
    owner: root
    group: root
    mode: '0644'
  become: true
  when: effective_logging_backend != 'fluentd'
  register: heartbeat_config

- name: Ensure heartbeat service is started and enabled
  ansible.builtin.service:
    name: heartbeat-elastic
    state: started
    enabled: true
  become: true
  when: effective_logging_backend != 'fluentd'

- name: Restart heartbeat service if configuration changed
  ansible.builtin.service:
    name: heartbeat-elastic
    state: restarted
  become: true
  when:
    - effective_logging_backend != 'fluentd'
    - heartbeat_config.changed
